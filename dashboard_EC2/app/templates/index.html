<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>SmartCity Environmental Dashboard</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef2f7;
        }

        .header {
            background: #0f172a;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .container {
            width: 95%;
            margin: auto;
            margin-top: 20px;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            flex: 1;
            background: white;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .card h3 {
            margin-top: 0;
            color: #1e3a8a;
        }

        #map {
            height: 450px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
        }

        th {
            background: #1e3a8a;
            color: white;
            padding: 12px;
        }

        td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }

        .normal {
            color: green;
            font-weight: bold;
        }

        .warning {
            color: orange;
            font-weight: bold;
        }

        .dangerous {
            color: red;
            font-weight: bold;
        }

    </style>
</head>

<body>

<div class="header">
    <h1>SmartCity Environmental Dashboard</h1>
    <p>Real-Time IoT Monitoring Platform</p>
</div>

<div class="container">

    <div class="cards">

        <div class="card">
            <h3>Total Sensors</h3>
            <h2 id="totalSensors">0</h2>
        </div>

        <div class="card">
            <h3>Danger Alerts</h3>
            <h2 id="dangerCount">0</h2>
        </div>

        <div class="card">
            <h3>System Status</h3>
            <h2 style="color:green;">ONLINE</h2>
        </div>

    </div>

    <div id="map"></div>

    <table>

        <thead>
        <tr>
            <th>Sensor ID</th>
            <th>District</th>
            <th>Temperature</th>
            <th>CO2</th>
            <th>NO2</th>
            <th>Status</th>
            <th>Timestamp</th>
        </tr>
        </thead>

        <tbody id="sensorTable">
        </tbody>

    </table>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

let map = L.map('map').setView([3.1390,101.6869],10);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19
}).addTo(map);

let markers = [];

function clearMarkers(){
    markers.forEach(m=>map.removeLayer(m));
    markers=[];
}

function getColor(status){

    if(status==="DANGEROUS")
        return "red";

    if(status==="WARNING")
        return "orange";

    return "green";
}

function loadData(){

fetch("/api/sensors")

.then(response=>response.json())

.then(data=>{

    document.getElementById("totalSensors").innerText=data.length;

    let danger=data.filter(
        s=>s.status==="DANGEROUS"
    ).length;

    document.getElementById("dangerCount").innerText=danger;

    let table=document.getElementById("sensorTable");

    table.innerHTML="";

    clearMarkers();

    data.forEach(sensor=>{

        let row=`
        <tr>
            <td>${sensor.sensor_id}</td>
            <td>${sensor.district}</td>
            <td>${sensor.temperature}°C</td>
            <td>${sensor.co2}</td>
            <td>${sensor.no2}</td>
            <td class="${sensor.status.toLowerCase()}">
                ${sensor.status}
            </td>
            <td>${sensor.timestamp}</td>
        </tr>
        `;

        table.innerHTML+=row;

        if(sensor.lat && sensor.lng){

            let marker=L.circleMarker(
            [sensor.lat,sensor.lng],
            {
                radius:10,
                color:getColor(sensor.status),
                fillColor:getColor(sensor.status),
                fillOpacity:0.8
            });

            marker.addTo(map);

            marker.bindPopup(
            "<b>"+sensor.district+"</b><br>"+
            "Sensor: "+sensor.sensor_id+"<br>"+
            "Temperature: "+sensor.temperature+"°C<br>"+
            "CO2: "+sensor.co2+"<br>"+
            "NO2: "+sensor.no2+"<br>"+
            "Status: "+sensor.status
            );

            markers.push(marker);
        }

    });

})

.catch(error=>{

    console.log(error);

});

}

loadData();

setInterval(loadData,5000);

</script>

</body>

</html>
