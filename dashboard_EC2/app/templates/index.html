<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SmartCity Environmental Dashboard</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f1f5f9;
    color: #111827;
}

.header {
    background: #0f172a;
    color: white;
    padding: 24px;
    text-align: center;
}

.container {
    max-width: 1200px;
    margin: 25px auto;
    padding: 20px;
}

.cards {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 18px;
    margin-bottom: 20px;
}

.card {
    background: white;
    border-radius: 14px;
    padding: 20px;
    text-align: center;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}

.card h2 {
    margin: 0;
    color: #1e3a8a;
}

.card p {
    font-size: 28px;
    font-weight: bold;
    margin: 12px 0 0;
}

#map {
    height: 450px;
    border-radius: 14px;
    margin-bottom: 25px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 6px 18px rgba(0,0,0,0.1);
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #e5e7eb;
    text-align: center;
}

th {
    background: #1e3a8a;
    color: white;
}

.status {
    padding: 6px 12px;
    border-radius: 20px;
    color: white;
    font-weight: bold;
}

.NORMAL { background: #16a34a; }
.WARNING { background: #f59e0b; }
.DANGEROUS { background: #dc2626; }

.footer {
    text-align: center;
    color: #64748b;
    padding: 20px;
}
</style>
</head>

<body>

<div class="header">
    <h1>SmartCity Environmental Dashboard</h1>
    <p>Real-time IoT air quality monitoring powered by AWS</p>
</div>

<div class="container">

    <div class="cards">
        <div class="card">
            <h2>Total Sensors</h2>
            <p id="totalSensors">0</p>
        </div>
        <div class="card">
            <h2>Dangerous Alerts</h2>
            <p id="dangerCount">0</p>
        </div>
        <div class="card">
            <h2>Dashboard Status</h2>
            <p style="color:#16a34a">LIVE</p>
        </div>
    </div>

    <div id="map"></div>

    <table>
        <thead>
            <tr>
                <th>Sensor ID</th>
                <th>District</th>
                <th>Temperature</th>
                <th>CO2</th>
                <th>NO2</th>
                <th>Status</th>
                <th>Timestamp</th>
            </tr>
        </thead>
        <tbody id="sensorTable"></tbody>
    </table>

</div>

<div class="footer">
    SmartCity IoT Environmental Monitoring System | EC2 Flask Dashboard
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
const map = L.map("map").setView([3.1390, 101.6869], 11);

L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
    maxZoom: 19,
    attribution: "© OpenStreetMap"
}).addTo(map);

let markers = [];

function getColor(status) {
    if (status === "DANGEROUS") return "red";
    if (status === "WARNING") return "orange";
    return "green";
}

function clearMarkers() {
    markers.forEach(marker => map.removeLayer(marker));
    markers = [];
}

function loadSensorData() {
    fetch("/api/sensors")
        .then(response => response.json())
        .then(data => {
            document.getElementById("totalSensors").innerText = data.length;

            const dangerous = data.filter(item => item.status === "DANGEROUS").length;
            document.getElementById("dangerCount").innerText = dangerous;

            const table = document.getElementById("sensorTable");
            table.innerHTML = "";

            clearMarkers();

            data.forEach(sensor => {
                const row = `
                    <tr>
                        <td>${sensor.sensor_id || ""}</td>
                        <td>${sensor.district || ""}</td>
                        <td>${sensor.temperature || ""}°C</td>
                        <td>${sensor.co2 || ""}</td>
                        <td>${sensor.no2 || ""}</td>
                        <td><span class="status ${sensor.status}">${sensor.status}</span></td>
                        <td>${sensor.timestamp || ""}</td>
                    </tr>
                `;
                table.innerHTML += row;

                if (sensor.lat && sensor.lng) {
                    const marker = L.circleMarker([sensor.lat, sensor.lng], {
                        radius: 10,
                        color: getColor(sensor.status),
                        fillColor: getColor(sensor.status),
                        fillOpacity: 0.8
                    }).addTo(map);

                    marker.bindPopup(`
                        <b>${sensor.district}</b><br>
                        Sensor: ${sensor.sensor_id}<br>
                        Temp: ${sensor.temperature}°C<br>
                        CO2: ${sensor.co2}<br>
                        NO2: ${sensor.no2}<br>
                        Status: ${sensor.status}
                    `);

                    markers.push(marker);
                }
            });
        })
        .catch(error => {
            console.error("Failed to load sensor data:", error);
        });
}

loadSensorData();
setInterval(loadSensorData, 5000);
</script>

</body>
</html>
